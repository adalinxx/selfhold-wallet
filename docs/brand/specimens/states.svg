<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600"><style>
.paper{fill:#ffffff}.ink{fill:#0a0a0a}.rule{stroke:#e6e6e6;fill:none}.stroke{stroke:#0a0a0a;fill:none}.inv{fill:#ffffff}.invs{stroke:#ffffff;fill:none}
.guide{stroke:#0a0a0a;stroke-dasharray:3 3;fill:none;opacity:.35}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0a0a0a}
text.inv{fill:#ffffff}.caps{letter-spacing:.08em;text-transform:uppercase}.b{font-weight:600}
@media (prefers-color-scheme:dark){.paper{fill:#0a0a0a}.ink{fill:#ededed}.rule{stroke:#1c1c1c}.stroke{stroke:#ededed}.inv{fill:#0a0a0a}.invs{stroke:#0a0a0a}
.guide{stroke:#ededed}text{fill:#ededed}text.inv{fill:#0a0a0a}}
</style><rect class="paper" width="720" height="600"/><text x="20" y="22" font-size="11" text-anchor="start" class="b caps">ACTIVITY · SHAPE, WORD AND SIGN; INVERSION ONLY WHERE THERE IS SOMETHING TO DO</text><rect class="rule" x="20.5" y="36.5" width="679" height="47"/><g class="stroke" transform="translate(36 52) scale(0.6666666666666666)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g><text x="64" y="65" font-size="12" text-anchor="start" class="caps b">Sent</text><text x="500" y="65" font-size="14" text-anchor="end" class="">−250</text><rect class="rule" x="20.5" y="84.5" width="679" height="47"/><g class="stroke" transform="translate(36 100) scale(0.6666666666666666)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17"/><path d="M17 17H7V7"/></g><text x="64" y="113" font-size="12" text-anchor="start" class="caps b">Received</text><text x="500" y="113" font-size="14" text-anchor="end" class="">+1,000</text><rect class="rule" x="20.5" y="132.5" width="679" height="47"/><g class="stroke" transform="translate(36 148) scale(0.6666666666666666)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g><text x="64" y="161" font-size="12" text-anchor="start" class="caps b">Pending</text><text x="500" y="161" font-size="14" text-anchor="end" class="">−40</text><rect class="ink" x="604" y="144" width="80" height="24"/><text x="644" y="160" font-size="11" text-anchor="middle" class="caps inv">Speed up</text><rect class="rule" x="20.5" y="180.5" width="679" height="47"/><g class="stroke" transform="translate(36 196) scale(0.6666666666666666)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></g><text x="64" y="209" font-size="12" text-anchor="start" class="caps b">Failed</text><text x="500" y="209" font-size="14" text-anchor="end" class="">−12</text><rect class="ink" x="628" y="192" width="56" height="24"/><text x="656" y="208" font-size="11" text-anchor="middle" class="caps inv">Retry</text><rect class="rule" x="20.5" y="228.5" width="679" height="47"/><text x="64" y="257" font-size="12" text-anchor="start" class="caps b">REPLACED →</text><text x="500" y="257" font-size="14" text-anchor="end" class="">−40</text><line class="stroke" x1="470" y1="252.5" x2="502" y2="252.5"/><text x="20" y="316" font-size="11" text-anchor="start" class="b caps">WARNINGS · INK WEIGHT, NEVER COLOR</text><rect class="rule" x="20.5" y="330.5" width="679" height="43"/><text x="36" y="357" font-size="12" text-anchor="start" class=""><tspan font-weight="600" letter-spacing=".08em">NOTE</tspan><tspan dx="12">This site has not connected before.</tspan></text><rect class="stroke" x="20.5" y="386.5" width="679" height="43"/><g class="stroke" transform="translate(36 400) scale(0.6666666666666666)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g><text x="64" y="413" font-size="12" text-anchor="start" class=""><tspan font-weight="600" letter-spacing=".08em">WARNING</tspan><tspan dx="12">The fee is below what this node relays.</tspan></text><rect class="ink" x="20" y="442" width="680" height="56"/><g class="invs" transform="translate(36 462) scale(0.6666666666666666)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g><text x="64" y="475" font-size="12" text-anchor="start" class="inv"><tspan font-weight="600" letter-spacing=".08em">DANGER</tspan><tspan dx="12">This request pays an address you have never paid.</tspan></text><rect class="ink" x="20" y="518" width="334" height="36"/><text x="187" y="540" font-size="12" text-anchor="middle" class="caps inv">Reject</text><rect class="rule" x="366.5" y="518.5" width="333" height="35"/><text x="533" y="540" font-size="12" text-anchor="middle" class="caps">Sign anyway</text><text x="20" y="584" font-size="11" text-anchor="start" class="">On danger the safe choice is the filled button; the risky one is outlined.</text></svg>
